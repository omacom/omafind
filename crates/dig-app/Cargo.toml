[package]
name = "dig-app"
description = "The Dig search window: a GPUI Shell host running the QuickJS UI in ui/."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dig-core = { path = "../dig-core" }
dig-client = { path = "../dig-client" }
dig-setup = { path = "../dig-setup" }
dig-index = { path = "../dig-index" }
dig-extract = { path = "../dig-extract" }
gpui-kit.workspace = true
gpui-shell.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml = "0.9"
notify = "8"
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
