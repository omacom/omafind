[package]
name = "omafindd"
description = "Omafind's daemon: watches the chosen folders, indexes in a worker child, answers searches over a socket."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omafindd"
path = "src/main.rs"

[dependencies]
omafind-core = { path = "../omafind-core" }
omafind-embed = { path = "../omafind-embed" }
omafind-extract = { path = "../omafind-extract" }
omafind-index = { path = "../omafind-index" }
omafind-store = { path = "../omafind-store" }
omafind-client = { path = "../omafind-client" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = "8"
zbus = "5"
signal-hook = "0.3"
