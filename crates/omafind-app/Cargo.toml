[package]
name = "omafind-app"
description = "The Omafind search window: a GPUI Shell host running the QuickJS UI in ui/."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omafind-core = { path = "../omafind-core" }
omafind-client = { path = "../omafind-client" }
omafind-setup = { path = "../omafind-setup" }
omafind-index = { path = "../omafind-index" }
# Direct, for its engine path (DEP_LLAMA_RPATH in build.rs).
omafind-embed = { path = "../omafind-embed" }
omafind-extract = { path = "../omafind-extract" }
gpui-kit.workspace = true
gpui-shell.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml = "0.9"
notify = "8"
# The desktop portal's folder chooser.
zbus = "5"
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
