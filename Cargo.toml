[workspace]
resolver = "2"
members = [
    "crates/omafind-core",
    "crates/omafind-embed",
    "crates/omafind-store",
    "crates/omafind-extract",
    "crates/omafind-index",
    "crates/omafind-client",
    "crates/omafind-setup",
    "crates/omafindd",
    "crates/omafind-cli",
    "crates/omafind-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/omacom/omafind"

[workspace.dependencies]
# GPUI Kit: not on crates.io, pinned by revision. Only omafind-app uses it.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "50dac1cafb34a4d453c92715219c0458d9a4727b" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

# What install.sh and the PKGBUILD build: link-time optimised, one codegen unit, stripped. Our own crates (the vector
# scan, ranking, the indexer) stay at full speed; third-party code is optimised for size, except what runs hot: the
# renderer (window frames), SQLite, and the image decoders (indexing).
# `cargo build --profile dist` takes ~10 minutes; day to day, release.
[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "fat"
codegen-units = 1

[profile.dist.package."*"]
opt-level = "z"

[profile.dist.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
libsqlite3-sys = { opt-level = 3 }
rusqlite = { opt-level = 3 }
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
png = { opt-level = 3 }

# The renderer is slow to the eye in an unoptimised debug build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
